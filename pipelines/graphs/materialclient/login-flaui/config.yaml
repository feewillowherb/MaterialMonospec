id: login-flaui
created: "2026-08-27"
graph:
  product: materialclient
  domain: materialclient
  family: observe
  goal: login-observe-flaui
  status: active
environment: local
stopOnError: false
secretsRef: secrets.local.yaml
sockets:
  start: session-anonymous
  end: observe-captured
cook: new-object

target:
  # 指针来自源码；禁止仅靠显示名
  hostProject: repos/MaterialClient/src/MaterialClient
  startupRef: repos/MaterialClient/src/MaterialClient/Services/StartupService.cs
  viewPointer: repos/MaterialClient/src/MaterialClient.UI/Views/LoginWindow.axaml
  viewModel: MaterialClient.UI.ViewModels.LoginWindowViewModel
  windowTitle: 凡东智能物料验收系统
  controls:
    usernameName: UsernameTextBox
    passwordName: PasswordTextBox
    submitContent: 立即登录
  # 启动：优先附着已显示 LoginWindow 的进程；否则用 secrets.exePath 启动
  launch:
    mode: attach-or-launch
    # 可选提示路径（机器相关最终以 secrets.local.yaml 的 exePath 为准）
    exePathHint: repos/MaterialClient/src/MaterialClient/bin/Debug/net10.0/win-x64/MaterialClient.exe
  prerequisites:
    - 本机授权有效（否则会先出 AuthCodeWindow，本 Graph 停并人闸）
    - 无活跃会话（HasActiveSessionAsync=false），否则不会显示 LoginWindow

auth:
  mode: form
  fields: [username, password]

steps:
  - id: bind-session
    name: 读 secrets；windows_list_windows / snapshot 确认 LoginWindow
  - id: cook-login
    name: fill 账号密码 → click 立即登录 → 等待登录结束
  - id: validate-surface
    name: 再 snapshot/screenshot；对照 expect；写 summary/report

expect:
  - id: login-window-reachable
    level: L0
    description: 能定位 Title=凡东智能物料验收系统 且可见账号/密码/立即登录 控件
  - id: login-submitted
    level: L1
    description: 已提交登录；短暂可见「正在登录...」或随后表面离开纯登录壳（非仅报错红字）
  - id: post-login-surface
    level: L2
    description: LoginWindow 隐藏且出现有人值守主窗（或等价主界面）；无持续 ErrorMessage
  # L3 仅用户：账号权限/业务是否接受本次登录

capture:
  screenshot:
    required: true
    sink: screenshots/
    moments: [pre-login, post-login]
  uiaSnapshot:
    required: true
    sink: uia/
    moments: [pre-login, post-login]
  logs:
    required: true
    sink: logs/
    note: 若无法挂钩应用日志则写 source missing
  http:
    required: true
    sink: http/
    note: 桌面端默认难截获；无代理则 source missing / count 0

humanGates:
  - missing-secrets
  - license-or-authcode-blocking
  - acceptance

failurePolicy:
  retries: 2
  stopOnError: false

adapters:
  ui:
    mcp: windows
    tools:
      - windows_list_windows
      - windows_launch
      - windows_snapshot
      - windows_fill
      - windows_click
      - windows_screenshot
      - windows_batch
    experimental: false
