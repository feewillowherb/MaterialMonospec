id: solidwaste-legacy-net-flag-ingest
created: "2026-11-07"
graph:
  product: materialclient
  domain: materialclient
  family: ingest
  goal: solidwaste-legacy-independent-net-flag
  status: active
environment: local
stopOnError: true
secretsRef: secrets.local.yaml
sockets:
  start: sqlite-idle
  end: flag-written
cook: in-place

target:
  # Default: local copy under _tmp (see pipeline.md). Override via secrets.local.yaml databasePath.
  databaseRel: _tmp/117/MaterialClient.db
  flagKey: SolidWasteInfo.UseIndependentDisplayedNet
  flagValue: true

scenario:
  dryRun: true
  # Match Waybills by PlateNumber + JoinTime/OutTime second-precision prefix
  targets:
    - plateNumber: 浙A26E23
      joinTime: "2026-11-04 07:51:17"
      outTime: "2026-11-04 07:54:33"
    - plateNumber: 浙A68L08
      joinTime: "2026-11-04 09:31:57"
      outTime: "2026-11-04 09:34:31"
    - plateNumber: 浙A68L08
      joinTime: "2026-11-04 10:27:49"
      outTime: "2026-11-04 10:36:04"

steps:
  - id: bind-paths
    name: Resolve SQLite path / runDir
  - id: locate-waybills
    name: Locate 3 Waybills by plate + join/out second prefix
  - id: cook-flag
    name: Merge ExtraProperties flag (dryRun or write)
  - id: validate
    name: Re-read ExtraProperties; assert flag present when write

expect:
  - id: db-reachable
    level: L0
    description: MaterialClient.db opens and Waybills exists
  - id: targets-located
    level: L1
    description: Exactly one Waybill per target (3 rows)
  - id: flag-applied
    level: L2
    description: After -Write, each ExtraProperties has UseIndependentDisplayedNet=true
  - id: business-ok
    level: L3
    description: User confirms UI/export/print show independent net for these 3 — user only

capture:
  prepare:
    required: true
    sink: prepare/
  summary:
    required: true
    sink: summary.json
  report:
    required: true
    sink: report.md

humanGates:
  - dry-run-confirm
  - destructive-write-confirm
  - acceptance

failurePolicy:
  retries: 0
  stopOnError: true

adapters:
  ingest:
    mode: script-invoke
    script: scripts/Invoke-SolidwasteLegacyNetFlag.ps1
    experimental: true
    nodeTool: scripts/set-independent-net-flag.ts
