id: postweight
created: "2026-08-20"
graph:
  product: urban
  domain: govsync
  family: probe
  goal: gov-inout-record-save
  status: active
environment: shared # 非 local：政府内网地址；run 前须人闸确认
stopOnError: true
secretsRef: secrets.local.yaml
sockets:
  start: endpoint-idle
  end: probe-recorded
cook: new-object

target:
  method: POST
  url: http://191.12.15.58:8899/sapi/v1/inoutRecord/save
  contentType: application/json; charset=utf-8
  # 指针来自用户 + UrbanManagement GovSyncWeightPayload / 联调样例；禁止靠显示名
  contractRef: repos/UrbanManagement/src/UrbanManagement.Core/Models/GovSyncWeightPayload.cs
  analysisRef: docs/gov-sync-postweight-analysis.md

scenario:
  buildLicenseNo: XNXS20250819001 # 对接码（对齐联调样例字段 buildLicenseNo）
  carNo: 浙A12345
  carNoColor: 黄 # 夹具车牌为黄牌；与 FromRecord 缺省一致
  carColor: null
  inOutType: 0
  weightTon: 20
  grossWeightKg: 20000 # 20t → kg；联调样例同时写 grossWeight 与 goodsWeight
  tareWeight: 0
  carType: 大车 # 20000 > 4500
  deviceID: "01"
  siteType: "1"
  areaCode: "330109" # GovSyncConstants.XiaoShanAreaCode
  snapTimeMode: run-now # 每次执行取本机当前时间 yyyy-MM-dd HH:mm:ss
  snapImages:
    source: fixtures/test_pic.jpg
    encoding: base64-array # 必须是 JSON 数组，禁止空字符串

steps:
  - id: bind-endpoint
    name: Bind 端点、夹具与场景参数
  - id: cook-post
    name: 组装 payload（含当前 snapTime）并 POST
  - id: validate-response
    name: 记录 HTTP 状态与业务 code/msg

expect:
  - id: http-reachable
    level: L0
    description: 对 target.url 的 POST 得到可解析的 HTTP 响应（非纯网络超时）
  - id: json-body
    level: L1
    description: 响应体可解析为含 code/msg 的 JSON
  - id: business-success
    level: L2
    description: 业务 code == 200（GovApiConstants.SuccessCode）；msg 记录原文
  # L3 仅用户：平台是否真正入库、业务是否可接受

capture:
  requestResponse:
    required: true
    sink: http/
    redact: [authorization, cookie, snapImages]
    note: snapImages 在证据中只保留 count 与字节长度，不落完整 Base64
  summary:
    required: true
    sink: summary.json

humanGates:
  - missing-secrets
  - environment-shared-confirm
  - destructive-write-confirm # POST save 会写入政府平台
  - acceptance

failurePolicy:
  retries: 2
  stopOnError: true

adapters:
  http:
    mode: script-invoke
    script: scripts/Invoke-GovSyncPostWeight.ps1
    experimental: true
