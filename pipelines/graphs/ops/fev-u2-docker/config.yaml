id: "fev-u2-docker"
created: "2026-11-03"
graph:
  product: platform
  domain: ops
  family: probe
  goal: ops-fev-u2-docker
  status: active
environment: local
stopOnError: true
secretsRef: secrets.local.yaml
sockets:
  start: fev-u1-evidenced
  end: fev-u2-evidenced
cook: new-object

target:
  identityRel: .local/.ssh/docker-linux-ed25519
  identityFileName: docker-linux-ed25519
  defaultPort: 2222
  fevId: U2
  fevDoc: docs/2026-11-02-urbanmanagement-docker-mssql-upgrade/05-部署与切换回滚.md
  remoteScriptRel: scripts/remote-u2-docker.sh
  # Docker networks must not overlap the VM's eth0 172.17.56.144/28 (blueprint 05 §1.2 N4).
  bip: 10.233.0.1/24
  poolBase: 10.234.0.0/16
  poolSize: 24
  # Docker Hub is unreachable from the VM; mcr.microsoft.com is reachable (blueprint 05 §1.2 N5).
  registryMirror: https://docker.m.daocloud.io
  # D7 = temporary mitigation: keep 2 vCPU / 3.7 GiB, cap MSSQL memory.
  mssqlMemoryLimitMb: 1536
  keepMssqlProbe: false

prerequisites:
  - fev-u1-host run with Verdict FEASIBLE (d1Path D1-B)
  - OpenSSH client on PATH; key at .local/.ssh/docker-linux-ed25519
  - secrets.local.yaml with host/user/port (+ identityPassphrase when key is encrypted)
  - Remote user has passwordless sudo (human gate sudo-nopasswd-required)

steps:
  - id: bind-config
    name: Read config/secrets; create runs/<ts>/
  - id: unlock-identity-optional
    name: Unlock temporary .batch identity; removed in finally
  - id: preflight
    name: Read-only sudo / docker / mirrors / routes check
  - id: install
    name: Write daemon.json (bip + pools + mirror), install docker-ce from aliyun mirror, enable docker (requires -Apply)
  - id: verify
    name: docker info, hello-world, MSSQL 2022 Express probe container (memory capped), create DB, remove probe
  - id: agent-analyze
    name: Agent writes prepare/u2-parse.json, summary.json, report.md

expect:
  - id: identity-and-ssh
    level: P0
    description: Identity usable and SSH reachable
  - id: remote-executed
    level: P1
    description: Remote script executed (exit 0)
  - id: agent-verdict
    level: P2
    description: Agent wrote U2 Verdict FEASIBLE/INFEASIBLE with markers
  - id: user-ack
    level: P3
    description: User-only

capture:
  ssh: { required: true, sink: ssh/ }
  prepare: { required: true, sink: prepare/ }
  summary: { required: true, sink: summary.json }
  report: { required: true, sink: report.md }

humanGates:
  - missing-secrets
  - missing-identity
  - sudo-nopasswd-required
  - apply-required-for-install

failurePolicy:
  retries: 0
  stopOnError: true

adapters:
  ssh:
    mode: script-invoke
    script: ../../../_shared/ops/ssh/Invoke-SshRemote.ps1
    experimental: true
  cook:
    mode: script-invoke
    script: scripts/Invoke-FevU2Docker.ps1
    experimental: true
