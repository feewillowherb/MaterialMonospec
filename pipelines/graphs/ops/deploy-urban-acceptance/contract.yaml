id: deploy-urban-acceptance
graph:
  domain: ops
  family: ingest
  goal: ops-deploy-urban-acceptance
  status: active
input:
  state: fev-u10-evidenced
  secretsRef: secrets.local.yaml
  requiredSecrets:
    - host
    - user
  optionalSecrets:
    - identityPassphrase
    - port
  identityRel: .local/.ssh/docker-linux-ed25519
  importSource: _tmp/UrbanManagement_test.upgraded.db
output:
  state: urban-acceptance-deployed
  artifacts:
    - ssh/
    - scp/
    - prepare/
    - summary.json
    - report.md
invariants:
  - uses pipelines/_shared/ops/ssh helpers only for SSH / scp
  - deploy runs only with -Apply (human gate deploy-approval); -ResetDatabase additionally needs reset-database-approval
  - database passwords are generated on the VM into /opt/urbanmanagement/.env (600 root) and never leave the VM
  - the local appsettings.secret.json travels only on SSH stdin and is used only when the IIS config is unreadable
  - the wwwroot share is mounted read-only and unmounted in the same run
  - import writes only into an empty database; a non-empty database is skipped unless -ResetDatabase
  - deployProfile=acceptance requires GovSync unregistered on every role (dry / parallel-IIS)
  - deployProfile=production (default after cutover) allows GovSync only on um-worker; non-worker roles must stay at 0
  - host-side health uses externalProbePort (5233) only; publicPort (5333) remains VM compose listen and is not host-facing
  - Phase 2 only: um-gateway is the only service publishing a port; sync switches can only be enabled on um-worker
  - VM available memory below memMinAvailableMb yields gate vm-memory-below-threshold (D14), never an automatic VM change
  - the host side (portproxy, firewall, IIS) is never changed by this Graph
  - CONFIG_SOURCE=local after cutover (IIS wwwroot share unreadable) is expected and not a fail by itself
  - temporary .batch identity is deleted after cook
  - Pipeline result is not product APPROVED
acceptance: P0-P3
