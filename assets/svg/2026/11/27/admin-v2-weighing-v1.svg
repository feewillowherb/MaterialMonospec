  <line x1="0" y1="48" x2="220" y2="48" stroke="#1E293B" stroke-width="1"/>

  <text x="18" y="76" class="f t-group">城管 · 5001</text>
  <rect x="22" y="98" width="12" height="12" rx="2" fill="none" stroke="#64748B" stroke-width="1.4"/>
