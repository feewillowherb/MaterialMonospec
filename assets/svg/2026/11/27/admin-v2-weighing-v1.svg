  <rect x="236" y="14" width="22" height="20" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
  <line x1="242" y1="20" x2="252" y2="20" stroke="#475569" stroke-width="1.5"/>
  <line x1="242" y1="24" x2="252" y2="24" stroke="#475569" stroke-width="1.5"/>
