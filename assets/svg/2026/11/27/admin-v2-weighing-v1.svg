<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <title>新版 Admin 称重记录页（Vue 3 + Element Plus）高保真预览</title>
  <desc>展示称重记录页行内并排 2 张现场照片缩略图（移除查看照片按钮）、车牌/重量/照片同屏扫读带、表头手动拖拽调宽，以及展开态的宽弹层长项目名搜索下拉（完整换行不截断）。</desc>
  <defs>
    <style>
      .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .t-brand { font-size: 15px; font-weight: 700; fill: #F8FAFC; }
      .t-group { font-size: 11px; font-weight: 600; fill: #64748B; letter-spacing: 0.5px; }
      .t-nav { font-size: 13px; fill: #CBD5E1; }
      .t-nav-act { font-size: 13px; font-weight: 600; fill: #FFFFFF; }
      .t-crumb-m { font-size: 13px; fill: #64748B; }
      .t-crumb { font-size: 13px; font-weight: 600; fill: #0F172A; }
      .t-sm { font-size: 12px; fill: #475569; }
      .t-xs { font-size: 11px; fill: #64748B; }
      .t-th { font-size: 12px; font-weight: 600; fill: #334155; }
      .t-td { font-size: 13px; fill: #1E293B; }
      .t-td-b { font-size: 13px; font-weight: 600; fill: #0F172A; }
      .t-td-m { font-size: 12px; fill: #64748B; }
      .t-link { font-size: 12px; font-weight: 500; fill: #2563EB; }
      .t-warn-l { font-size: 12px; font-weight: 500; fill: #D97706; }
      .t-btn { font-size: 12px; font-weight: 500; fill: #FFFFFF; }
      .t-btn-g { font-size: 12px; font-weight: 500; fill: #334155; }
      .b-ok { fill: #DCFCE7; }
      .t-ok { font-size: 11px; font-weight: 600; fill: #15803D; }
      .b-err { fill: #FEE2E2; }
      .t-err { font-size: 11px; font-weight: 600; fill: #B91C1C; }
      .b-mute { fill: #F1F5F9; }
      .t-mute { font-size: 11px; font-weight: 500; fill: #64748B; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
      .inp { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .inp-focus { fill: #FFFFFF; stroke: #2563EB; stroke-width: 1.5; }
      .sep { stroke: #E2E8F0; stroke-width: 1; }
      .row-sep { stroke: #F1F5F9; stroke-width: 1; }
    </style>
    <filter id="pop-sh" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="fix-sh2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.06"/>
    </linearGradient>
    <!-- Reusable vector photo thumbnail 1: panoramic weighbridge scene -->
    <g id="thumb-pano">
      <rect x="0" y="0" width="72" height="48" rx="4" fill="#CBD5E1"/>
      <rect x="0" y="0" width="72" height="22" rx="4" fill="#93C5FD"/>
      <rect x="0" y="28" width="72" height="20" rx="2" fill="#64748B"/>
      <rect x="14" y="16" width="32" height="18" rx="2" fill="#334155"/>
      <rect x="46" y="21" width="14" height="13" rx="2" fill="#1D4ED8"/>
      <circle cx="23" cy="36" r="4" fill="#0F172A"/>
      <circle cx="51" cy="36" r="4" fill="#0F172A"/>
      <rect x="0" y="0" width="72" height="48" rx="4" fill="none" stroke="#CBD5E1"/>
    </g>
    <!-- Reusable vector photo thumbnail 2: plate / rear close-up -->
    <g id="thumb-plate">
      <rect x="0" y="0" width="72" height="48" rx="4" fill="#334155"/>
      <rect x="8" y="13" width="56" height="22" rx="2" fill="#FACC15" stroke="#1E293B" stroke-width="1"/>
      <text x="36" y="28" text-anchor="middle" class="mono" style="font-size:10px;font-weight:700;fill:#0F172A;">浙A8921</text>
      <rect x="0" y="0" width="72" height="48" rx="4" fill="none" stroke="#CBD5E1"/>
    </g>
    <!-- Missing photo placeholder -->
    <g id="thumb-empty">
      <rect x="0" y="0" width="72" height="48" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="3 2"/>
      <text x="36" y="28" text-anchor="middle" class="f" style="font-size:11px;fill:#94A3B8;">无图</text>
    </g>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1440" height="900" fill="#F4F6F9"/>

  <!-- Sidebar (220px) -->
